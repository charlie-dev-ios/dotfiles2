# eza のカラーテーマ (TokyoNight Night)
# ghostty の tokyonight_night パレットに合わせた配色。
# EZA_CONFIG_DIR (~/.config/eza) 配下に置くと eza が自動で読み込む。
#
# 色は ANSI ではなく 24bit の HEX で指定している。
#   赤     #f7768e   緑     #9ece6a   黄     #e0af68
#   青     #7aa2f7   紫     #bb9af7   水     #7dcfff
#   橙     #ff9e64   前景   #c0caf5   微暗   #565f89

colourful: true

# ---- ファイル種別 ----
filekinds:
  normal: { foreground: "#c0caf5" }
  directory: { foreground: "#7aa2f7", is_bold: true }
  symlink: { foreground: "#7dcfff" }
  pipe: { foreground: "#565f89" }
  block_device: { foreground: "#e0af68", is_bold: true }
  char_device: { foreground: "#e0af68", is_bold: true }
  socket: { foreground: "#565f89" }
  special: { foreground: "#bb9af7" }
  executable: { foreground: "#9ece6a", is_bold: true }
  mount_point: { foreground: "#bb9af7", is_underline: true }

# ---- パーミッション ----
perms:
  user_read: { foreground: "#c0caf5", is_bold: true }
  user_write: { foreground: "#e0af68", is_bold: true }
  user_execute_file: { foreground: "#9ece6a", is_bold: true }
  user_execute_other: { foreground: "#9ece6a" }
  group_read: { foreground: "#c0caf5" }
  group_write: { foreground: "#e0af68" }
  group_execute: { foreground: "#9ece6a" }
  other_read: { foreground: "#a9b1d6" }
  other_write: { foreground: "#e0af68" }
  other_execute: { foreground: "#9ece6a" }
  special_user_file: { foreground: "#bb9af7" }
  special_other: { foreground: "#565f89" }
  attribute: { foreground: "#565f89" }

# ---- ファイルサイズ ----
size:
  major: { foreground: "#c0caf5", is_bold: true }
  minor: { foreground: "#7dcfff" }
  number_byte: { foreground: "#c0caf5" }
  number_kilo: { foreground: "#9ece6a" }
  number_mega: { foreground: "#7aa2f7" }
  number_giga: { foreground: "#bb9af7" }
  number_huge: { foreground: "#ff9e64", is_bold: true }
  unit_byte: { foreground: "#565f89" }
  unit_kilo: { foreground: "#9ece6a" }
  unit_mega: { foreground: "#7aa2f7" }
  unit_giga: { foreground: "#bb9af7" }
  unit_huge: { foreground: "#ff9e64", is_bold: true }

# ---- ユーザー / グループ ----
users:
  user_you: { foreground: "#c0caf5", is_bold: true }
  user_root: { foreground: "#f7768e" }
  user_other: { foreground: "#bb9af7" }
  group_yours: { foreground: "#c0caf5" }
  group_other: { foreground: "#565f89" }
  group_root: { foreground: "#f7768e" }

# ---- リンク数 ----
links:
  normal: { foreground: "#7dcfff" }
  multi_link_file: { foreground: "#e0af68" }

# ---- Git ステータス ----
git:
  new: { foreground: "#9ece6a", is_bold: true }
  modified: { foreground: "#e0af68", is_bold: true }
  deleted: { foreground: "#f7768e", is_bold: true }
  renamed: { foreground: "#7dcfff", is_bold: true }
  typechange: { foreground: "#bb9af7", is_bold: true }
  ignored: { foreground: "#565f89" }
  conflicted: { foreground: "#f7768e", is_underline: true }

git_repo:
  branch_main: { foreground: "#c0caf5" }
  branch_other: { foreground: "#bb9af7" }
  git_clean: { foreground: "#9ece6a" }
  git_dirty: { foreground: "#f7768e" }

# ---- その他のメタデータ ----
punctuation: { foreground: "#565f89" }
date: { foreground: "#7dcfff" }
inode: { foreground: "#565f89" }
blocks: { foreground: "#565f89" }
header: { foreground: "#c0caf5", is_bold: true, is_underline: true }
octal: { foreground: "#7dcfff" }
flags: { foreground: "#bb9af7" }

# ---- 壊れたシンボリックリンク ----
broken_symlink: { foreground: "#f7768e", is_underline: true }
broken_path_overlay: { foreground: "#f7768e", is_underline: true }

# ---- 拡張子グループによるファイルタイプ ----
file_type:
  image: { foreground: "#bb9af7" }
  video: { foreground: "#ff9e64" }
  music: { foreground: "#9ece6a" }
  lossless: { foreground: "#7dcfff" }
  crypto: { foreground: "#f7768e" }
  document: { foreground: "#c0caf5" }
  compressed: { foreground: "#e0af68" }
  temp: { foreground: "#565f89" }
  compiled: { foreground: "#7aa2f7" }
  build: { foreground: "#9ece6a", is_bold: true }
  source: { foreground: "#7aa2f7" }
