# mise でグローバルに管理するツール (~/.config/mise/config.toml)
# 言語ランタイムやエディタのバージョンをここで一元管理する。
#   mise install        # この設定に書かれたツールを一括インストール
#   mise use -g <tool>  # ツールを追記しつつインストール

[tools]
# Neovim 本体。Homebrew ではなく mise で入れることで
# バージョン固定・切り替えを容易にする。
# 更新するときは値を上げて `mise install` を実行する。
#
# バックエンドは aqua を明示指定する。既定の vfox バックエンドは社内プロキシ環境で
# 取得に失敗するため (vfox プラグインがプロキシ設定を尊重しない)、GitHub Releases から
# 直接取得する aqua (aquaproj/aqua-registry の neovim/neovim) を使う。
"aqua:neovim/neovim" = "0.12.2"

# Node.js ランタイム。現行 LTS (22 系) を利用する。
# 社内プロキシ環境で取得できるよう、neovim と同様 aqua バックエンドを明示指定する
# (aquaproj/aqua-registry の nodejs/node)。メジャーを固定し、22 系の最新を取得する。
# パッチ更新は `mise upgrade` で取り込む。
"aqua:nodejs/node" = "22"

# Lua の LSP サーバ (lua_ls)。Neovim 設定 (Lua) を書く際の補完・診断に使う。
# mason ではなく mise で管理し、PATH 上の実行ファイルを nvim-lspconfig が利用する。
# 社内プロキシ環境で取得できるよう aqua バックエンドを明示指定する
# (aquaproj/aqua-registry の LuaLS/lua-language-server)。
"aqua:LuaLS/lua-language-server" = "latest"

# Java (JDK)。Kotlin コンパイラと kotlin-language-server の実行に必要。
# mise 組込みの core:java で Eclipse Temurin の LTS (21 系) を導入する。
"java" = "temurin-21"

# Kotlin コンパイラ (kotlinc / kotlin)。
# 社内プロキシ環境で取得できるよう、vfox/asdf ではなく github バックエンドを
# 明示指定し、JetBrains/kotlin の GitHub Releases から直接取得する
# (mise レジストリの kotlin と同じアセット・パス指定)。
"github:JetBrains/kotlin" = { version = "latest", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }

# Kotlin の LSP サーバ (kotlin_language_server)。
# aqua レジストリ・mise レジストリともに未登録のため github バックエンドで
# fwcd/kotlin-language-server の Releases (server.zip) から取得する。
# zip 内の server/bin/kotlin-language-server を PATH に通す。
"github:fwcd/kotlin-language-server" = { version = "latest", asset_pattern = "server.zip", bin_path = "server/bin" }
