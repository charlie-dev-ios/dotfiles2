# mise でグローバルに管理するツール (~/.config/mise/config.toml)
# 言語ランタイムやエディタのバージョンをここで一元管理する。
#   mise install        # この設定に書かれたツールを一括インストール
#   mise use -g <tool>  # ツールを追記しつつインストール

[tools]
# Neovim 本体。Homebrew ではなく mise で入れることで
# バージョン固定・切り替えを容易にする。
# 更新するときは値を上げて `mise install` を実行する。
#
# バックエンドは aqua を明示指定する。既定の vfox バックエンドは社内プロキシ環境で
# 取得に失敗するため (vfox プラグインがプロキシ設定を尊重しない)、GitHub Releases から
# 直接取得する aqua (aquaproj/aqua-registry の neovim/neovim) を使う。
"aqua:neovim/neovim" = "0.12.2"

# Node.js ランタイム。現行 LTS (22 系) を利用する。
# 社内プロキシ環境で取得できるよう、neovim と同様 aqua バックエンドを明示指定する
# (aquaproj/aqua-registry の nodejs/node)。メジャーを固定し、22 系の最新を取得する。
# パッチ更新は `mise upgrade` で取り込む。
"aqua:nodejs/node" = "22"
